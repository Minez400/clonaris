[package]
name = "clonaris"
version = "0.1.0"
edition = "2024"
authors = ["minez400"]
description = "A modern, ultra-fast, and frictionless version control system built in 100% Pure Rust with zero external dependencies."
license = "MIT"
readme = "README.md"
keywords = ["vcs", "git", "version-control", "pure-rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
